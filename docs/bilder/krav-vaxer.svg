<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1a1a1a"
     role="img" aria-labelledby="titel beskrivning">
<title id="titel">Samma funktion, tre olika lösningar: PoC, pilot och produktion</title>
<desc id="beskrivning">Tre kolumner med staplade komponenter. PoC består av modell och prompt, egna dokument i kontexten och ett verktyg. Piloten lägger till loggning, kända fall att mäta mot samt ägare och slutdatum. Produktion med känsliga uppgifter lägger dessutom till behörighet per användare, filtrering och gallring, regressionstest vid modellbyte samt översyn och förvaltning. Understa komponenten är densamma i alla tre.</desc>
<style>
/* Ljust läge ligger i presentationsattribut på varje element, så figuren blir rätt
   även i renderare som inte kör CSS. Här finns bara mörkerlägets avvikelser. */
@media (prefers-color-scheme:dark){
  .kort{fill:#202024;stroke:#3d3d46}
  .ruta{fill:#2a2a31;stroke:#3d3d46}
  .accruta{fill:#22303f;stroke:#6cb6ff}
  .bas{fill:#6f6fd8;stroke:#6f6fd8}
  .ram{stroke:#a3a3ae}
  .lin{stroke:#3d3d46}
  .pil{stroke:#a3a3ae}
  .spets{fill:#a3a3ae}
  text{fill:#e9e9ee}
  .s,.h{fill:#a3a3ae}
  .v,.vs{fill:#ffffff}
}
</style>

<rect class="kort" x="0.5" y="0.5" width="879" height="469" rx="10" fill="#ffffff" stroke="#d8d8de"/>

<!-- kolumn 1 · PoC -->
<text class="t" x="30" y="46" font-size="14" font-weight="600" fill="#1a1a1a">PoC</text>
<text class="s" x="30" y="64" font-size="11.5" fill="#5f5f6a">visar att det går</text>
<rect class="ruta" x="30" y="324" width="260" height="28" rx="5" fill="#f4f4f7" stroke="#d8d8de"/>
<text class="b" x="44" y="342" font-size="11.5" fill="#1a1a1a">Ett verktyg som hämtar rätt</text>
<rect class="ruta" x="30" y="358" width="260" height="28" rx="5" fill="#f4f4f7" stroke="#d8d8de"/>
<text class="b" x="44" y="376" font-size="11.5" fill="#1a1a1a">Egna dokument i kontexten</text>
<rect class="bas" x="30" y="392" width="260" height="28" rx="5" fill="#1b1b6e" stroke="#1b1b6e"/>
<text class="v" x="44" y="410" font-size="11.5" font-weight="600" fill="#ffffff">Modellen och prompten</text>

<!-- kolumn 2 · Pilot -->
<text class="t" x="310" y="46" font-size="14" font-weight="600" fill="#1a1a1a">Pilot</text>
<text class="s" x="310" y="64" font-size="11.5" fill="#5f5f6a">riktiga användare, avgränsat</text>
<rect class="ruta" x="310" y="222" width="260" height="28" rx="5" fill="#f4f4f7" stroke="#d8d8de"/>
<text class="b" x="324" y="240" font-size="11.5" fill="#1a1a1a">Ägare, slutdatum, avgränsning</text>
<rect class="ruta" x="310" y="256" width="260" height="28" rx="5" fill="#f4f4f7" stroke="#d8d8de"/>
<text class="b" x="324" y="274" font-size="11.5" fill="#1a1a1a">Kända fall att mäta mot</text>
<rect class="ruta" x="310" y="290" width="260" height="28" rx="5" fill="#f4f4f7" stroke="#d8d8de"/>
<text class="b" x="324" y="308" font-size="11.5" fill="#1a1a1a">Loggning av varje anrop</text>
<rect class="ruta" x="310" y="324" width="260" height="28" rx="5" fill="#f4f4f7" stroke="#d8d8de"/>
<text class="b" x="324" y="342" font-size="11.5" fill="#1a1a1a">Ett verktyg som hämtar rätt</text>
<rect class="ruta" x="310" y="358" width="260" height="28" rx="5" fill="#f4f4f7" stroke="#d8d8de"/>
<text class="b" x="324" y="376" font-size="11.5" fill="#1a1a1a">Egna dokument i kontexten</text>
<rect class="bas" x="310" y="392" width="260" height="28" rx="5" fill="#1b1b6e" stroke="#1b1b6e"/>
<text class="v" x="324" y="410" font-size="11.5" font-weight="600" fill="#ffffff">Modellen och prompten</text>

<!-- kolumn 3 · Produktion -->
<text class="t" x="590" y="46" font-size="14" font-weight="600" fill="#1a1a1a">Produktion</text>
<text class="s" x="590" y="64" font-size="11.5" fill="#5f5f6a">med känsliga uppgifter</text>
<rect class="accruta" x="590" y="86" width="260" height="28" rx="5" fill="#e8f0fa" stroke="#0b5fa5"/>
<text class="b" x="604" y="104" font-size="11.5" fill="#1a1a1a">Översyn, eskalering, förvaltning</text>
<rect class="accruta" x="590" y="120" width="260" height="28" rx="5" fill="#e8f0fa" stroke="#0b5fa5"/>
<text class="b" x="604" y="138" font-size="11.5" fill="#1a1a1a">Regressionstest vid modellbyte</text>
<rect class="accruta" x="590" y="154" width="260" height="28" rx="5" fill="#e8f0fa" stroke="#0b5fa5"/>
<text class="b" x="604" y="172" font-size="11.5" fill="#1a1a1a">Filtrering och gallring av data</text>
<rect class="accruta" x="590" y="188" width="260" height="28" rx="5" fill="#e8f0fa" stroke="#0b5fa5"/>
<text class="b" x="604" y="206" font-size="11.5" fill="#1a1a1a">Behörighet per användare</text>
<rect class="ruta" x="590" y="222" width="260" height="28" rx="5" fill="#f4f4f7" stroke="#d8d8de"/>
<text class="b" x="604" y="240" font-size="11.5" fill="#1a1a1a">Ägare, slutdatum, avgränsning</text>
<rect class="ruta" x="590" y="256" width="260" height="28" rx="5" fill="#f4f4f7" stroke="#d8d8de"/>
<text class="b" x="604" y="274" font-size="11.5" fill="#1a1a1a">Kända fall att mäta mot</text>
<rect class="ruta" x="590" y="290" width="260" height="28" rx="5" fill="#f4f4f7" stroke="#d8d8de"/>
<text class="b" x="604" y="308" font-size="11.5" fill="#1a1a1a">Loggning av varje anrop</text>
<rect class="ruta" x="590" y="324" width="260" height="28" rx="5" fill="#f4f4f7" stroke="#d8d8de"/>
<text class="b" x="604" y="342" font-size="11.5" fill="#1a1a1a">Ett verktyg som hämtar rätt</text>
<rect class="ruta" x="590" y="358" width="260" height="28" rx="5" fill="#f4f4f7" stroke="#d8d8de"/>
<text class="b" x="604" y="376" font-size="11.5" fill="#1a1a1a">Egna dokument i kontexten</text>
<rect class="bas" x="590" y="392" width="260" height="28" rx="5" fill="#1b1b6e" stroke="#1b1b6e"/>
<text class="v" x="604" y="410" font-size="11.5" font-weight="600" fill="#ffffff">Modellen och prompten</text>

<line class="lin" x1="30" y1="428.5" x2="850" y2="428.5" stroke="#d8d8de"/>
<text class="s" x="30" y="450" font-size="11.5" fill="#5f5f6a">Funktionen är densamma i alla tre kolumnerna. Det som växer är allt runt omkring — och det växer snabbast när uppgifterna är känsliga.</text>
</svg>
