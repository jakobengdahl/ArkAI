# Backend, worker och frontend — steg 3 av 3.
#
# Mall, renderas av verktyg/installera/eneo.sh. Läggs på först när jobbet i
# 02-init.yaml är klart.
#
# Backend och worker är två containrar i *samma* podd. Det är inte en
# förenkling utan ett krav: backend skriver en uppladdad fil till /tmp och
# lägger bara sökvägen i jobbkön, och workern öppnar sedan samma sökväg. Eneos
# compose-fil löser det med en delad volym. Här är lagringsklassen
# ReadWriteOnce, så två poddar kan inte dela en volym — men två containrar i
# en podd kan dela en emptyDir. Med separata poddar misslyckas varje
# kunskapsuppladdning med FileNotFoundError i workerns logg, medan backend
# loggar att allt gick bra.

---
apiVersion: v1
kind: Service
metadata:
  name: eneo-backend
  labels:
    app.kubernetes.io/part-of: eneo
spec:
  selector:
    app.kubernetes.io/name: eneo-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eneo-backend
  labels:
    app.kubernetes.io/part-of: eneo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eneo-backend
  template:
    metadata:
      # Ändras adressen — en ny VS Code-tjänst får ett nytt värdnamn för porten
      # — ändras mallen, och då startas poddarna om med den nya konfigurationen.
      # Utan det läser de kvar den gamla adressen ur miljön och inloggningen
      # hamnar på fel origin.
      annotations:
        labb/public-origin: "${PUBLIC_ORIGIN}"
      labels:
        app.kubernetes.io/name: eneo-backend
        app.kubernetes.io/part-of: eneo
    spec:
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          envFrom:
            - configMapRef:
                name: eneo-backend-konfig
            - secretRef:
                name: eneo-hemligheter
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: temp
              mountPath: /tmp
        # Samma image, men run.sh startar ARQ-workern i stället för gunicorn.
        - name: worker
          image: ${BACKEND_IMAGE}
          env:
            - name: RUN_AS_WORKER
              value: "true"
          envFrom:
            - configMapRef:
                name: eneo-backend-konfig
            - secretRef:
                name: eneo-hemligheter
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: temp
              mountPath: /tmp
      volumes:
        # Delas av backend och worker — se kommentaren överst i filen.
        - name: data
          emptyDir: {}
        - name: temp
          emptyDir: {}

# ── Frontend ──────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: eneo-frontend
  labels:
    app.kubernetes.io/part-of: eneo
spec:
  selector:
    app.kubernetes.io/name: eneo-frontend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eneo-frontend
  labels:
    app.kubernetes.io/part-of: eneo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eneo-frontend
  template:
    metadata:
      # Ändras adressen — en ny VS Code-tjänst får ett nytt värdnamn för porten
      # — ändras mallen, och då startas poddarna om med den nya konfigurationen.
      # Utan det läser de kvar den gamla adressen ur miljön och inloggningen
      # hamnar på fel origin.
      annotations:
        labb/public-origin: "${PUBLIC_ORIGIN}"
      labels:
        app.kubernetes.io/name: eneo-frontend
        app.kubernetes.io/part-of: eneo
    spec:
      containers:
        - name: frontend
          image: ${FRONTEND_IMAGE}
          envFrom:
            - configMapRef:
                name: eneo-frontend-konfig
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eneo-hemligheter
                  key: JWT_SECRET
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
