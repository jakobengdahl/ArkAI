# Katalog över det som går att installera, starta och öppna i labbet.
#
# Den här filen är master för allt körbart. Panelen (verktyg/panel/panel.py) och
# verktyg/kor.sh läser den — ingen av dem vet något om enskilda tjänster utöver
# det som står här. Vill du lägga till en tjänst: lägg till en [tjanst.<id>] här
# och en markdownfil under docs/, inte ett nytt skript i panelen.
#
# Alla kommandon körs med repots rot som arbetskatalog.

[panel]
port = 8082
# Samma panel på en exponerad port, så att den nås direkt från Onyxia ("Port 8086")
# utan VS Code. Bakom inloggning: användaren står här, lösenordet är PANEL_LOSEN
# i Vault-hemligheten och står aldrig i repot. Saknas det startas porten inte.
# 8082 ovan är kvar, utan inloggning, och nås bara via code-servers proxy.
publik_port = 8086
publik_anvandare = "arkai@arkai.se"
startsida = "docs/START.md"

# Vänsterspalten i panelen. Titel + markdownfil.
[[navigering]]
titel = "Start"
fil = "docs/START.md"
[[navigering]]
titel = "Översikt"
fil = "docs/00-oversikt/README.md"
[[navigering]]
titel = "Användningsfall"
fil = "docs/10-anvandningsfall/README.md"
[[navigering]]
titel = "Tekniker"
fil = "docs/20-tekniker/README.md"
[[navigering]]
titel = "Experiment"
fil = "docs/30-experiment/README.md"
[[navigering]]
titel = "Matchning"
fil = "docs/40-matchning/README.md"
[[navigering]]
titel = "PoC → produktion"
fil = "docs/50-fran-poc-till-produktion/README.md"
[[navigering]]
titel = "Miljön"
fil = "docs/60-miljo/README.md"
[[navigering]]
titel = "Minnesbanken"
fil = "minnesbank/MINNE.md"
[[navigering]]
titel = "Bidra"
fil = "BIDRA.md"


# ── Byggstenarna ──────────────────────────────────────────────────────────
#
# Listan från docs/20-tekniker/byggstenar.md, i samma ordning som bilden.
# Finns här för att varje verktyg nedan ska kunna säga vilka av dem det
# faktiskt innehåller — det är den kopplingen som gör startsidan användbar.
# Id:na är desamma som filnamnen i docs/bilder/byggstenar/.
#
# Lägen ett verktyg kan ange, och vad de betyder:
#
#   inbyggd    ingår, och går inte att koppla bort
#   konfig     ingår, men måste ställas in innan den gör någon nytta
#   tillval    ingår inte från början, går att lägga till
#   begransad  finns delvis — läs noten innan du räknar med den
#   saknas     finns inte, och det är en känd lucka

[[byggsten]]
id = "applikationslagret"
namn = "Applikationslagret"
[[byggsten]]
id = "api-lagret"
namn = "API-lagret"
[[byggsten]]
id = "orkestrering"
namn = "Orkestrering"
[[byggsten]]
id = "modellen"
namn = "Modellen"
[[byggsten]]
id = "kontext-och-minne"
namn = "Kontext och minne"
[[byggsten]]
id = "verktygslagret"
namn = "Verktygslagret"
[[byggsten]]
id = "arbetssatt"
namn = "Arbetssätt som paket"
[[byggsten]]
id = "sakerhet-och-behorighet"
namn = "Säkerhet och behörighet"
[[byggsten]]
id = "driftmiljon"
namn = "Driftmiljön"
[[byggsten]]
id = "utvardering"
namn = "Utvärdering"
[[byggsten]]
id = "mansklig-oversyn"
namn = "Mänsklig översyn"
[[byggsten]]
id = "livscykelhantering"
namn = "Livscykelhantering"


# ── Tjänster ──────────────────────────────────────────────────────────────
#
#   typ         lokal  = en process i den här podden
#               fjarr  = något som redan kör någon annanstans
#   steg        auto     = installeras av labb-start.sh vid uppstart
#               begaran  = installeras när någon trycker på knappen
#   finns       kommando som lyckas när tjänsten är installerad
#   halsa       URL som svarar när tjänsten kör (annars används port)
#   egen_ingress  true = kräver att porten exponerades när tjänsten startade
#   webbsida      false = svarar på sin port men har inget att titta på i en
#                 webbläsare. Panelen visar adressen i stället för Öppna
#   koppla_eneo   kommando som kopplar in tjänsten i Eneo. Panelen visar
#                 knappen bara när Eneo svarar — den skriver mot Eneos API
#   avvecklas     true = på väg ut. Installeras inte automatiskt och visas
#                 inte bland verktygen. Skripten finns kvar
#   efter_installation  handlingar som kor.sh kör direkt efter en lyckad
#                 installation, t.ex. ["starta", "koppla_eneo"]
#   inloggning    { anvandare, losenord } — visas som text på kortet när
#                 tjänsten kör, bredvid adressen
#   avinstallera  kommando som tar bort tjänsten. Panelen visar knappen "Ta
#                 bort", frågar först och kör aldrig det direkt från kortet
#   avinstallera_varning  vad som går förlorat — visas på bekräftelsesidan
#   avinstallera_visa     läskommando vars utdata visas på samma sida, så att
#                 man ser vad som faktiskt försvinner innan man trycker

[tjanst.grund]
namn = "Grundmiljön"
beskrivning = "Node, GitHub CLI och git-autentisering, installerat under ~/.local så att det överlever en omstart."
dok = "docs/60-miljo/verktygslada.md"
typ = "verktyg"
steg = "auto"
finns = "command -v node && command -v gh"
installera = "verktyg/installera/bas.sh"
[tjanst.grund.byggstenar]
driftmiljon = { lage = "inbyggd", not = "Podden allt annat kör i. Det som installeras här ligger under ~/.local och överlever en omstart." }

[tjanst.eneo]
namn = "Eneo"
beskrivning = "Öppen AI-plattform för svensk offentlig sektor, med behörighetsmodell, revisionslogg och OIDC. Labbets huvudspår när frågan är drift, inte demo."
dok = "docs/60-miljo/eneo.md"
# Modellerna som "Koppla in modellerna" lägger upp, för alla som installerar
# labbet. Den första chattmodellen blir standard. Finns en modell inte hos
# plattformen hoppas den över.
modeller = ["gemma4-26b-moe", "qwen3-8-27b", "qwen3-6-35b-moe"]
embedding_modell = "qwen3-embedding-8b"
# Visas på kortet i panelen när tjänsten kör, bredvid adressen.
inloggning = { anvandare = "arkai@arkai.se" }
# Delvis lokal: själva Eneo kör som arbetslaster i namnrymden och överlever en
# poddomstart. Det som kör här i podden är proxyn som lägger frontend och
# backend på samma origin — och den behöver den exponerade porten.
typ = "lokal"
steg = "begaran"
port = 8084
finns = "command -v caddy && kubectl get deployment eneo-backend"
installera = "verktyg/installera/eneo.sh"
# Installera ska lämna ett Eneo som går att logga in i och chatta med: proxyn
# startad och modellerna inkopplade. Det gör att Ta bort + Installera i
# panelen räcker för att byta version.
efter_installation = ["starta", "koppla_eneo"]
starta = "verktyg/starta-eneo.sh --bakgrund"
stoppa = "verktyg/starta-eneo.sh --stoppa"
koppla_eneo = "verktyg/konfigurera-eneo.py --skriv"
koppla_eneo_knapp = "Koppla in modellerna"
halsa = "http://127.0.0.1:8084/version"
egen_ingress = true
# Stoppa skalar till noll och behåller allt. Ta bort raderar — och det är inte
# en detalj: Eneo kör i namnrymden och fortsätter göra det när den här podden
# är borta. Panelen frågar först och visar vad som försvinner.
avinstallera = "verktyg/ta-bort-eneo.sh"
avinstallera_varning = "Eneos databas raderas — konton, assistenter, chattar och kunskapskällor försvinner. Vill du bara stänga av tills vidare, använd Stoppa: då skalas alla poddar till noll och all data ligger kvar."
avinstallera_visa = "kubectl get deployments,statefulsets,jobs,services,pvc -l app.kubernetes.io/part-of=eneo"
[tjanst.eneo.byggstenar]
applikationslagret = { lage = "inbyggd", not = "Chatt, assistenter, spaces och admingränssnitt. Det är produkten — den går inte att koppla bort." }
sakerhet-och-behorighet = { lage = "inbyggd", not = "Roller, organisationer, spaces och revisionslogg ingår. OIDC och SCIM finns i produkten men är inte påslaget här — det kräver en identitetsleverantör att federera mot." }
api-lagret = { lage = "inbyggd", not = "Eneos eget API, och LiteLLM bakom modellhanteringen. Det är därför vilken OpenAI-kompatibel leverantör som helst duger." }
driftmiljon = { lage = "konfig", not = "Fem arbetslaster i namnrymden. Imager, minne och volymstorlekar står i verktyg/eneo/ och ändras genom att köra om installationen." }
modellen = { lage = "konfig", not = "Ingen modell från början. Läggs upp per organisation: en leverantör med bas-URL och nyckel, sedan chatt- och embeddingmodell. Knappen Koppla in modellerna gör det åt dig." }
verktygslagret = { lage = "tillval", not = "Ingen MCP-server från början, och ingen inbyggd verktygslåda. Adminen lägger upp MCP-servrar — bara Streamable HTTP, varken stdio eller SSE — och varje assistent väljer sedan vilka av deras verktyg den får använda." }
kontext-och-minne = { lage = "tillval", not = "Kunskapskällor per space: filer och webbsidor, indexerade med embeddingmodellen. Kräver alltså att en embeddingmodell är upplagd. Webbkryparen är avstängd här." }
arbetssatt = { lage = "tillval", not = "Assistenter med egna prompter, och assistentmallar som admin kan versionera och rulla tillbaka." }
orkestrering = { lage = "begransad", not = "En assistent kan välja bland sina verktyg i en tur. Flerstegsupplägg där något planerar, kör vidare och kommer tillbaka finns inte." }
mansklig-oversyn = { lage = "begransad", not = "Enskilda verktyg kan kräva godkännande innan de körs. Granskning av svar är en arbetsordning, inte en funktion." }
livscykelhantering = { lage = "begransad", not = "Assistentmallar versioneras och går att rulla tillbaka. Modellversion, prompter och index gör det inte." }
utvardering = { lage = "saknas", not = "Insights ger användningsstatistik — vem som frågar hur mycket. Kända fall, mätning och regressionstest får byggas utanför." }

[tjanst.hello-mcp]
namn = "Hello-MCP"
beskrivning = "Minsta möjliga MCP-server, exponerar minnesbanken. Pratar stdio för klienter som startar den själva, och Streamable HTTP för Eneo som når den över nätet."
dok = "exempel/mcp/hello-mcp/README.md"
typ = "lokal"
steg = "begaran"
# Porten Open WebUI hade. Den är exponerad i start-URL:en, och en exponerad
# port är det enda sättet för Eneo — som kör i en annan podd — att nå oss.
port = 8081
finns = "test -d exempel/mcp/hello-mcp/.venv"
installera = "verktyg/installera/hello-mcp.sh"
starta = "verktyg/starta-hello-mcp.sh --bakgrund"
stoppa = "verktyg/starta-hello-mcp.sh --stoppa"
halsa = "http://127.0.0.1:8081/halsa"
egen_ingress = true
# Ingen webbsida: roten svarar 404, det är MCP-slutpunkten som är poängen.
# Panelen visar adressen i stället för en Öppna-knapp.
webbsida = false
koppla_eneo = "verktyg/koppla-mcp-till-eneo.py hello-mcp --skriv"
# stdio-varianten, för klienter som startar servern själva. Skrivs till
# ~/work/.labb/mcp.json och kräver ingen port.
mcp_kommando = "uv run --directory {rot}/exempel/mcp/hello-mcp server.py"
# HTTP-varianten, för Eneo. URL:en byggs av ingressen för porten.
mcp_http_port = 8081
mcp_http_sokvag = "/mcp"
mcp_http_token_fil = "hello-mcp-token"
[tjanst.hello-mcp.byggstenar]
verktygslagret = { lage = "inbyggd", not = "Tre verktyg: lista, sök, läs. Det är hela servern — den finns för att visa mönstret, inte för att göra ett jobb." }
kontext-och-minne = { lage = "inbyggd", not = "Minnesbanken i det här repot. Index före innehåll: modellen ser vad som finns innan den hämtar något." }
sakerhet-och-behorighet = { lage = "konfig", not = "Över stdio är behörigheten given — klienten startade processen. Över HTTP ligger servern på ett publikt värdnamn, och då är token i ~/work/.labb/hello-mcp-token hela skyddet." }

[tjanst.mcpo]
namn = "MCP-brygga (mcpo)"
beskrivning = "Översätter MCP till OpenAPI. Byggdes för Open WebUI, som inte pratar MCP. Eneo gör det, så bryggan behövs inte längre i huvudspåret."
dok = "docs/20-tekniker/mcp.md"
typ = "lokal"
steg = "begaran"
port = 8083
finns = "command -v mcpo"
installera = "verktyg/installera/mcpo.sh"
starta = "verktyg/starta-mcpo.sh --bakgrund"
stoppa = "verktyg/starta-mcpo.sh --stoppa"
halsa = "http://127.0.0.1:8083/openapi.json"
webbsida = false
[tjanst.mcpo.byggstenar]
api-lagret = { lage = "inbyggd", not = "Ett protokollbyte och inget annat: MCP in, OpenAPI ut. Att det behövdes säger mer om klienten än om bryggan." }
verktygslagret = { lage = "konfig", not = "Vilka servrar som exponeras kommer ur ~/work/.labb/mcp.json, som genereras ur den här filen." }

[tjanst.openclaw]
namn = "OpenClaw"
beskrivning = "Självhostad agent-gateway. Här som experimentobjekt — kontrasten mot en chatt är att agenten når filer och kommandon och kan drivas utifrån."
dok = "docs/20-tekniker/agentupplagg.md"
typ = "lokal"
steg = "begaran"
port = 18789
finns = "command -v openclaw"
installera = "verktyg/installera/openclaw.sh"
starta = "openclaw gateway --port 18789"
starta_bakgrund = true   # kommandot återvänder inte av sig självt
# Inte ankrat: openclaw är ett Node-CLI, så kommandoraden börjar med
# interpretatorn ("node /.../openclaw gateway --port 18789"). Ta med porten
# i stället för att ankra, så mönstret blir specifikt utan att bli fel.
stoppa = "pkill -f 'openclaw gateway --port 18789'"
egen_ingress = true
[tjanst.openclaw.byggstenar]
orkestrering = { lage = "inbyggd", not = "Det är hela poängen med den: agenten planerar, kör och kommer tillbaka utan att någon trycker på knappen mellan stegen." }
applikationslagret = { lage = "inbyggd", not = "Eget gränssnitt, och en gateway som går att driva utifrån." }
verktygslagret = { lage = "konfig", not = "Läser ~/work/.labb/mcp.json — samma verktygsuppsättning som de andra klienterna." }
sakerhet-och-behorighet = { lage = "saknas", not = "Agenten når filer och kommandon i podden. Det finns ingen behörighetsmodell mellan den och dem — kör den bara på sådant du hade kört själv." }

[tjanst.metadatagraf]
namn = "Metadatagrafen"
beskrivning = "Pilotinstans för metadata som graf, med MCP-server. Kör redan — vi kopplar upp oss, vi installerar den inte."
dok = "docs/60-miljo/metadatagrafen.md"
typ = "fjarr"
url_env = "METADATAGRAF_URL"
halsa_sokvag = "/health"
mcp_sokvag = "/mcp/sse"
token_env = "METADATAGRAF_TOKEN"
ingress_matchning = "metadatagraph"
koppla_eneo = "verktyg/koppla-mcp-till-eneo.py metadatagraf --skriv"
# Eneo pratar bara Streamable HTTP. Grafen svarar på /mcp/ i roten — inte på
# den /web/-sökväg METADATAGRAF_URL pekar på, och inte på /mcp/sse.
mcp_http_url_env = "METADATAGRAF_URL"
mcp_http_sokvag = "/mcp/"
[tjanst.metadatagraf.byggstenar]
kontext-och-minne = { lage = "inbyggd", not = "Metadata som graf: inte vad som står om X, utan vad som hänger ihop med X. Den tredje av de tre sorters minne som blandas ihop." }
verktygslagret = { lage = "inbyggd", not = "Ett sextiotal verktyg över MCP — sök, hämta noder, följ relationer." }
sakerhet-och-behorighet = { lage = "konfig", not = "Bearer-token, utdelad av den som driver piloten. Den ligger i miljöns Vault-hemlighet, aldrig i repot." }

[tjanst.graf]
namn = "Egen graf"
beskrivning = "En egen instans av grafappen (CommunityOverview) med eget schema och egna objekt. Schemat redigeras i ~/work/graf-config, grafen ligger i ~/work/graf-data. Rör inte metadatagrafens pilot."
dok = "docs/60-miljo/egen-graf.md"
inloggning = { anvandare = "arkai@arkai.se", losenord = "arkai@arkai.se" }
# Kör här i podden, från källkod. Första försöket var en egen arbetslast i
# namnrymden, men klustret skapade ingen volym åt den — se dokumentationen.
typ = "lokal"
steg = "begaran"
port = 8085
finns = "test -x ~/work/.labb/graf/venv/bin/python && test -f ~/work/.labb/graf/kod/frontend/web/dist/index.html"
installera = "verktyg/installera/graf.sh"
efter_installation = ["starta", "koppla_eneo"]
# Appen läser schemat när den startar. Stoppa + Starta räcker alltså för att
# pröva ett ändrat schema.
starta = "verktyg/starta-graf.sh --bakgrund"
stoppa = "verktyg/starta-graf.sh --stoppa"
halsa = "http://127.0.0.1:8085/health"
egen_ingress = true
koppla_eneo = "verktyg/koppla-mcp-till-eneo.py graf --skriv"
koppla_eneo_knapp = "Koppla in i Eneo"
# Eneo kör i en annan podd. Servicen arkai-graf pekar på den här podden, så
# adressen är stabil även när poddens IP byts. Går den inte provas ingressen.
mcp_http_intern_url = "http://arkai-graf:8000/mcp/"
mcp_http_port = 8085
mcp_http_sokvag = "/mcp/"
mcp_http_token_fil = "graf-token"
# För klienter i podden (Claude Code m.fl.) via ~/work/.labb/mcp.json.
mcp_sokvag = "/mcp/sse"
avinstallera = "verktyg/ta-bort-graf.sh"
avinstallera_varning = "Grafens data i ~/work/graf-data raderas, med arkivet av tidigare grafer. Schemat i ~/work/graf-config ligger kvar. Vill du bara stänga av, använd Stoppa."
avinstallera_visa = "du -sh ~/work/graf-data ~/work/.labb/graf 2>/dev/null; ls ~/work/graf-data/arkiv 2>/dev/null"
[tjanst.graf.byggstenar]
kontext-och-minne = { lage = "konfig", not = "Domänminne som graf, med ditt eget schema. Startdata seedas ur ~/work/graf-config/graph.json när grafen saknas, och kan bytas mot valfri fil med verktyg/seeda-graf.sh." }
verktygslagret = { lage = "inbyggd", not = "Samma sextiotal MCP-verktyg som metadatagrafen. Eneo når dem inne i namnrymden, via Servicen arkai-graf." }
sakerhet-och-behorighet = { lage = "begransad", not = "En gemensam inloggning för webbgränssnittet och en token för MCP. Porten är publik, och lösenordet står i repot." }
driftmiljon = { lage = "konfig", not = "En process i podden, från källkod på samma commit som prod-imagen. Python 3.11 och beroenden som de var när imagen byggdes. Version och profil sätts med GRAF_COMMIT och GRAF_PROFIL." }

[tjanst.openwebui]
namn = "Open WebUI"
beskrivning = "Chattgränssnitt med dokumentuppladdning, RAG och verktygsanrop. Var labbets testbänk innan Eneo — på väg ut, se dokumentationen."
dok = "docs/60-miljo/openwebui.md"
typ = "lokal"
steg = "begaran"
# På väg ut: installeras inte automatiskt och visas inte bland verktygen.
# Skripten finns kvar och fungerar från terminalen.
avvecklas = true
finns = "command -v open-webui"
installera = "verktyg/installera/openwebui.sh"
starta = "verktyg/starta-openwebui.sh --bakgrund"
stoppa = "verktyg/starta-openwebui.sh --stoppa"
# Ingen port här med flit: 8081 är Hello-MCP:s nu. Startar du Open WebUI för
# hand tar den porten om den är ledig, men panelen ska inte rapportera
# "Open WebUI kör" för att något annat svarar på 8081.
[tjanst.openwebui.byggstenar]
applikationslagret = { lage = "inbyggd", not = "Chatt, dokumentuppladdning, verktygsanrop." }
sakerhet-och-behorighet = { lage = "begransad", not = "Inloggning finns, men slås på bara av strängen True. Ingen behörighetsmodell utöver användarkonton — det var det som gjorde att jämförelsen med Eneo blev intressant." }
verktygslagret = { lage = "konfig", not = "Pratar inte MCP. Kräver bryggan mcpo, som översätter till OpenAPI." }


# ── Uppsättningar ─────────────────────────────────────────────────────────
#
# Kombinationer som är tänkta att fungera ihop, för terminalen:
#
#   verktyg/kor.sh uppsattning eneo-plattform
#
# Panelen visar dem inte längre — där är verktygen och deras byggstenar
# ingången, och varje kort har sina egna knappar. Uppsättningen installerar det
# som saknas, startar i ordning, kopplar in det som går att koppla in i Eneo och
# skriver ~/work/.labb/mcp.json.

[uppsattning.eneo-plattform]
namn = "Eneo som plattform"
beskrivning = "Installerar Eneo i namnrymden, startar det och kopplar in plattformens modeller. Frågan: vad kostar det i styrning och drift att köra en plattform som är byggd för att förvaltas?"
tjanster = ["eneo"]
dok = "docs/60-miljo/eneo.md"

[uppsattning.eneo-med-verktyg]
namn = "Eneo med verktyg"
beskrivning = "Eneo, plus labbets två MCP-servrar inkopplade som verktygsservrar. Frågan: var går gränsen mellan att modellen svarar och att modellen gör — när verktygen ligger bakom en behörighetsmodell?"
tjanster = ["eneo", "hello-mcp", "metadatagraf"]
dok = "docs/20-tekniker/chattbot-plus-verktyg.md"

[uppsattning.eneo-med-egen-graf]
namn = "Eneo med egen graf"
